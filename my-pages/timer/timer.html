<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>タイマー</title>
     <link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&display=swap" rel="stylesheet">
     <!--FontGoogleからBIZフォントを入手-->
    <style>
        body {
            background-color: cornsilk;
            font-family: BIZ UDGothic; 
        } /*さっき入手したやつを使用 */
        #settext {
            color: black;
            font: x-large;
        } 
        #setbutton {
            color: black;
            background: white;
            width: 100px;
            height: 30px;
        }
        .set-UPtext{
            display: flex;
            gap: 80px;
            color: black;
        }
        .set-UP {
            display: flex;
            gap: 70px;
        }
        .set-UP button{
            width: 50px;
            height: 60px;
            background: white;
            color: black;
        }
        .settext {
             display: flex;
            gap: 80px;
            color: black;
        }
        .set-Down button{
            width: 50px;
            height: 60px;
            background: white;
            color: black;
        }
        .set-Down {
            display: flex;
            gap: 70px;
        }
        .timertext {
            gap: 80px;
            color: black;
        }
        #timertextbutton1 {
            width: 200px;
            height: 30px;
            background-color: green;
            color: white;
        }
        #timertextbutton2 {
            width: 200px;
            height: 30px;
            background-color: red;
            color: white;
        }
        [hidden] {
            display: none !important;
        } /* AI */
    </style>
</head>
<body>
	<h1 id="settext">タイマー設定</h1>
    <div class="timertext2">
        <h1 id="timerstart">タイマー - 開始</h1>
        <h1 id="timer"></h1>
    </div>
    <div class="timertext">
        <h1 id="timerstart">タイマー - 待機中</h1>
        <h1 id="timer"></h1>
    </div>
    <div id="timertextbutton1">
        <button id = "timertextbutton1" onclick="timerstart()">タイマースタート</button>
    </div>
    <div id="timertextbutton2">
        <button id = "timertextbutton2" onclick="timerstop()">タイマーストップ</button>
    </div>
    <div class="set-UPtext">
        <h1>秒</h1>
        <h1>分</h1>
        <h1>時</h1>
    </div>
    <div class="set-UP">
        <button onclick="secondUP()">↑</button>
        <button onclick="minuteUP()">↑</button>
        <button onclick="hourUP()">↑</button>
    </div>
    <div class="settext">
        <h1 id="secondTEXT"></h1>
        <h1 id="minuteTEXT"></h1>
        <h1 id="hourTEXT"></h1>
    </div>
    <div class="set-Down">
        <button onclick="secondDOWN()">↓</button>
        <button onclick="minuteDOWN()">↓</button>
        <button onclick="hourDOWN()">↓</button>
    </div>
    <button id="setbutton" onclick="setOK()">OK</button>
    <script>
        let second = 0;
        let minute = 0;
        let hour = 0;
        let setsecond = 0;
        let setminute = 0;
        let sethour = 0;
        let restsecond = 0;
        let restminute = 0;
        let resthour = 0;
        let timerID; 
        document.querySelector(".timertext").hidden = true;
        document.getElementById("timertextbutton1").hidden = true;
        document.querySelector(".timertext2").hidden = true;
            document.getElementById("timertextbutton2").hidden = true;
        setup_reset()
        function secondUP() {
            setsecond++
            if (setsecond === 60) {
                setsecond = 0;
                setminute++
                if (setminute === 60) {
                    setminute = 0;
                    sethour++;
                }
            }
            setup_reset()
        }
        function minuteUP() {
            setminute++
            if (setminute === 60) {
                setminute = 0;
                sethour++
            }
            setup_reset()
        }
        function hourUP() {
            sethour++
            setup_reset()
        }
        function secondDOWN() {
            if (sethour === 0 && setminute === 0 && setsecond === 0) return;
            setsecond--
            if (setsecond === -1) {
                setsecond = 59;
                setminute--
                if (setminute === -1) {
                    setminute = 59;
                    sethour--;
                }
            }
            setup_reset()
        }
        function minuteDOWN() {
            if (sethour === 0 && setminute === 0 && setsecond === 0) return;
            setminute--
            if (setminute === -1) {
                setminute = 59;
                sethour--
            }
            setup_reset()
        }
        function hourDOWN() {
            if (sethour === 0 && setminute === 0 && setsecond === 0) return;
            sethour--
            setup_reset()
        }
        function setOK() {
            document.getElementById("setbutton").hidden = true;
            document.getElementById("settext").hidden = true;

            document.querySelectorAll(
                ".set-UPtext, .set-UP, .settext, .set-Down"
            ).forEach(element => {
                element.hidden = true;
            }) //AI
            timeron()
        }
        function setup_reset() {
            document.getElementById("secondTEXT").textContent = setsecond + "秒";
            document.getElementById("minuteTEXT").textContent = setminute + "分";
            document.getElementById("hourTEXT").textContent = sethour + "時";
        }

        function timeron() {
            resthour = sethour;
            restminute = setminute;
            restsecond = setsecond;
            document.querySelector(".timertext").hidden = false;
            document.getElementById("timertextbutton1").hidden = false;
             document.getElementById("timer").textContent = "残り" + resthour + "時間" + restminute + "分" + restsecond + "秒"
        }

        function timerstart() {
            document.querySelector(".timertext").hidden = true;
            document.getElementById("timertextbutton1").hidden = true;
            document.querySelector(".timertext2").hidden = false;
            document.getElementById("timertextbutton2").hidden = false;
            timerId = setInterval(() => {
    // 経過時間を増やす
    second++;

    if (second >= 60) {
        second = 0;
        minute++;
    }
    if (minute >= 60) {
        minute = 0;
        hour++;
    }

    // 設定時間から経過時間を引く
    const remaining =
        (sethour * 3600 + setminute * 60 + setsecond) -
        (hour * 3600 + minute * 60 + second);

    const remainingSeconds = Math.max(0, remaining);

    resthour = Math.floor(remainingSeconds / 3600);
    restminute = Math.floor((remainingSeconds % 3600) / 60);
    restsecond = remainingSeconds % 60;

    // 時間切れで繰り返しを止める
    if (remainingSeconds === 0) {
        clearInterval(timerId);
        timerId = null;
    }
}, 1000);

        }

        function timerstop() {
            document.querySelector(".timertext").hidden = true;
            document.getElementById("timertextbutton1").hidden = true;
            document.querySelector(".timertext2").hidden = false;
            document.getElementById("timertextbutton2").hidden = false;
        }
    </script>
</body>
</html>
