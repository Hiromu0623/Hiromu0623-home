        .menup[hidden] {

        }

            display: none;
        }
        @media (max-width: 700px) {
            .menup {
                flex-direction: column;
                gap: 12px;
            }
        }
        .pc[hidden] {
            display: none;
        }
        .mobilea[hidden] {

        }

</head>

    <script>
        function updateMenu() {
            const Mobile = /iPhone|Android.+Mobile/i.test(navigator.userAgent)
                || window.matchMedia("(max-width: 700px)").matches;
            document.querySelector(".menup").hidden = Mobile;
            document.querySelector(".mobilea").hidden = !Mobile;
            document.querySelector(".pc").hidden = Mobile;
            document.querySelector(".menus").hidden = !Mobile;
        }

        updateMenu();
        window.addEventListener("resize", updateMenu);
    </script>
